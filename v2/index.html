<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>VulnOps Command Center</title>
<style>
/* Tokens — dataviz reference palette; severity = validated single-hue red ordinal ramp */
:root{
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.18);
  --accent:#2a78d6; --accent-soft:#cde2fb; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --deemph:#c3c2b7;
  --q100:#cde2fb; --q200:#9ec5f4; --q250:#86b6ef; --q300:#6da7ec; --q350:#5598e7; --q400:#3987e5; --q450:#2a78d6; --q500:#256abf; --q550:#1c5cab; --q600:#184f95; --q650:#104281; --q700:#0d366b;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-text:#006300;
  --sev-low:#ec9895; --sev-med:#e26b68; --sev-high:#c43b3b; --sev-crit:#8a1c1c;
  --shadow:0 6px 20px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --accent:#3987e5; --accent-soft:#0c2d6b; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --deemph:#4a4a47; --good-text:#0ca30c;
    --sev-low:#f4b3b0; --sev-med:#ea7f7c; --sev-high:#d64f4f; --sev-crit:#a52e2e;
    --shadow:0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --accent:#3987e5; --accent-soft:#0c2d6b; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --deemph:#4a4a47; --good-text:#0ca30c;
  --sev-low:#f4b3b0; --sev-med:#ea7f7c; --sev-high:#d64f4f; --sev-crit:#a52e2e;
  --shadow:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100vh}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;height:52px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.brand small{color:var(--muted);font-weight:400;font-size:11.5px}
.tabs{display:flex;gap:0;margin-left:6px;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.tab{border:0;background:none;padding:0 11px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.sp{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--plane)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink2);padding:5px 10px;font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center}
.filters .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.ms{position:relative}
.ms>button{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;max-width:220px}
.ms>button b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms>button .n{color:var(--muted)}
.ms>button.on{border-color:var(--accent);background:var(--accent-soft)}
.ms .pop{position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);min-width:230px;max-height:330px;overflow:auto;padding:6px;display:none}
.ms .pop.open{display:block}
.ms .pop .acts{display:flex;gap:6px;padding:2px 6px 6px;border-bottom:1px solid var(--grid);margin-bottom:4px}
.ms .pop .acts button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:2px 4px}
.ms .pop label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.ms .pop label:hover{background:var(--plane)}
.ms .pop label span.c{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;background:var(--surface)}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tg i{width:26px;height:14px;border-radius:7px;background:var(--axis);position:relative;display:inline-block}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--surface)}
.tg[aria-pressed="true"] i{background:var(--accent)} .tg[aria-pressed="true"] i::after{left:14px}
.search{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:12px;min-width:180px}
select.sel{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 16px;min-height:34px;background:var(--plane);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink2)}
.chip{background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:2px 9px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink);font-size:12px}
.chip b{font-weight:600}.chip .x{color:var(--muted)}.chip:hover{border-color:var(--accent)}
/* grid & cards */
main{padding:14px 16px 48px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-content:start}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1280px){.c2{grid-column:span 4}.c3{grid-column:span 4}.c4{grid-column:span 6}.c5{grid-column:span 6}.c7{grid-column:span 12}.c8{grid-column:span 12}.c9{grid-column:span 12}}
@media (max-width:820px){.c2,.c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .hd{display:flex;align-items:flex-start;gap:8px}
.card h3{margin:0;font-size:13px;font-weight:600;line-height:1.3}
.card .sub{font-size:11px;color:var(--muted);margin-top:1px}
.card .tools{margin-left:auto;display:flex;gap:2px;flex:none}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:4px;font-size:12px;line-height:1}
.icon-btn:hover{background:var(--plane);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.card .body{min-width:0}
/* per-card explainer (ⓘ) */
.info{display:none;font-size:11.5px;line-height:1.5;color:var(--ink2);background:var(--plane);border:1px solid var(--grid);border-radius:6px;padding:8px 10px}
.info.open{display:block}
.info b{color:var(--ink);font-weight:600}
.info p{margin:0}.info p+p{margin-top:5px}
.info code{font-size:11px}
.kpi{position:relative}
.kpi .ib{position:absolute;top:7px;right:7px}
.kpi .info{margin-top:6px}
.icon-btn.ib{font-size:13px;line-height:1;padding:1px 5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.line{height:2px;width:14px;border-radius:1px}
.hint{font-size:11px;color:var(--muted);margin-left:auto}
/* KPI */
.kpi{gap:4px;justify-content:center}
.kpi .l{font-size:11.5px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.kpi.hero .v{font-size:46px}
.kpi .d{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .d .bad{color:var(--crit);font-weight:600}.kpi .d .goodt{color:var(--good-text);font-weight:600}
.kpi .row{display:flex;align-items:flex-end;gap:10px;justify-content:space-between}
.kpi svg{flex:none}
.meter{height:8px;border-radius:4px;background:var(--q100);overflow:hidden;margin-top:4px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* tables */
.scroll{overflow:auto;max-height:320px;border:1px solid var(--grid);border-radius:6px}
table.dt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.dt th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border-strong);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1;user-select:none}
.dt th.num,.dt td.num{text-align:right}
.dt th .arr{color:var(--accent);margin-left:3px}
.dt td{padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.dt tr.click{cursor:pointer}.dt tr.click:hover td{background:var(--plane)}
.dt tr.sel td{background:var(--accent-soft)}
.sev{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11px}
.sev i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--ink)}
.pill.muted{background:var(--plane);color:var(--ink2);border:1px solid var(--grid)}
/* action queue */
.queue{display:flex;flex-direction:column}
.queue .q{display:flex;gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--grid)}
.queue .q:last-child{border-bottom:0}
.queue .n{font-size:20px;font-weight:600;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.queue .n.zero{color:var(--muted)}
.queue .t{flex:1;min-width:0}.queue .t small{display:block;color:var(--muted);font-size:11px}
/* SOP */
.sop p{margin:0 0 8px}
.sop table{width:100%;border-collapse:collapse;font-size:12px}
.sop th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.sop td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
.sop td:first-child{font-weight:600;white-space:nowrap}
details.rb{border:1px solid var(--border);border-radius:6px;padding:0 12px;background:var(--surface)}
details.rb+details.rb{margin-top:6px}
details.rb summary{cursor:pointer;padding:9px 0;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details.rb summary::-webkit-details-marker{display:none}
details.rb summary .st{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
details.rb summary .own{margin-left:auto;color:var(--muted);font-weight:400;font-size:11.5px}
details.rb .in{padding:0 0 10px 32px;color:var(--ink2)}
details.rb ul{margin:4px 0 8px;padding-left:18px}
details.rb li{margin:3px 0}
code{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:11.5px;background:var(--plane);padding:1px 5px;border-radius:3px;border:1px solid var(--grid)}
pre{background:var(--plane);border:1px solid var(--grid);padding:8px 10px;border-radius:6px;overflow:auto;font-size:11.5px;line-height:1.5;margin:6px 0}
pre code{background:none;border:0;padding:0}
.stages{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.stage{flex:1;min-width:110px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;cursor:pointer;background:var(--surface);position:relative}
.stage:hover{border-color:var(--accent)}
.stage.on{border-color:var(--accent);background:var(--accent-soft)}
.stage .sn{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stage .sl{font-size:11px;color:var(--ink2)}
.stage .bar{height:4px;border-radius:2px;margin-top:6px;background:var(--q100)}
.stage .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
/* tooltip & toast */
.tt{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);max-width:300px;display:none}
.tt .t{font-weight:600;margin-bottom:3px}
.tt .r{display:flex;gap:14px;align-items:center;justify-content:space-between;line-height:1.6}
.tt .r b{font-variant-numeric:tabular-nums}
.tt .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tt .r span{color:var(--ink2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:12px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:8px;width:min(860px,100%);max-height:80vh;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border-strong)}
.modal textarea{flex:1;min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--border-strong);border-radius:6px;padding:8px;background:var(--plane);color:var(--ink)}
svg text{font-family:inherit}
svg .hit{fill:transparent;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================
   1. Synthetic data — deterministic (seeded), generated at load.
   Every host, CVE id and ticket below is illustrative.
   ============================================================ */
'use strict';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260901);
const R=()=>rnd();
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function wpick(items,weights){let s=0;for(const w of weights)s+=w;let x=R()*s;for(let i=0;i<items.length;i++){x-=weights[i];if(x<=0)return items[i]}return items[items.length-1]}
const DAY=86400000;
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const dayDiff=(a,b)=>Math.floor((a-b)/DAY);
const fmtDate=d=>`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;

const LATEST=new Date(2026,8,1);
const SNAPSHOTS=[0,7,14,21,28,35,42,49].map(n=>addDays(LATEST,-n));

const OSES=[{n:'Windows Workstation',w:.44,p:'WKS',fam:'ws'},{n:'Windows Server',w:.22,p:'SRV',fam:'srv'},{n:'RHEL',w:.11,p:'LNX',fam:'lnx'},{n:'Ubuntu',w:.06,p:'LNX',fam:'lnx'},{n:'macOS',w:.09,p:'MAC',fam:'mac'},{n:'Network Device',w:.08,p:'NET',fam:'net'}];
const TEAMS=['Endpoint Engineering','Server Operations','Network Engineering','DevOps Platform','Database Ops','Application Support'];
const TIERS=['Tier 0','Tier 1','Tier 2','Tier 3'];
const SEVS=['Critical','High','Medium','Low'];
const SLA={Critical:7,High:30,Medium:60,Low:120};
const STATES=['New','Triaged','Assigned','In Progress','Pending Verification','Risk Accepted','Closed'];
const AGE_BANDS=['< 15 d','15–30 d','31–60 d','61–90 d','91+ d'];
const PRIORITIES=['P1 · Fix now','P2 · This sprint','P3 · Scheduled','P4 · Backlog'];
const JUSTIFICATIONS=['Business-critical application','Vendor patch not yet available','Compensating control in place','Legacy system — decommission scheduled','Network-isolated device','False positive under review'];
const APPROVERS=['Hargreaves, Theo','Balogun, Femi','Iqbal, Zara','Sørensen, Kaja','Okafor, Dami','Lindqvist, Mira'];

/* Vulnerability pool. fam = OS families it applies to. ex = public exploit, patch = vendor fix available */
const VULNS=[
 ['CVE-2025-29824','Windows CLFS Driver Elevation of Privilege','Windows',7.8,.71,1,1,1,['ws','srv']],
 ['CVE-2025-21418','Windows Ancillary Function Driver EoP','Windows',7.8,.62,1,1,1,['ws','srv']],
 ['CVE-2025-24983','Windows Win32k Kernel Subsystem EoP','Windows',7.0,.35,1,1,1,['ws']],
 ['CVE-2025-26633','Microsoft Management Console Security Bypass','Windows',7.0,.22,1,1,1,['ws','srv']],
 ['CVE-2025-33053','Windows WebDAV Remote Code Execution','Windows',8.8,.80,1,1,1,['ws','srv']],

/* Findings */
const ALL=[];

  let fid=1;
  const byFam={};
  for(const v of VULNS)for(const f of v.fam)(byFam[f]=byFam[f]||[]).push(v);
  const stateForOpen=(age,sev)=>{
    if(age<=3)return wpick(['New','Triaged'],[.7,.3]);
    if(age<=10)return wpick(['Triaged','Assigned','In Progress'],[.35,.4,.25]);
    return wpick(['Assigned','In Progress','Pending Verification'],[.35,.45,.2]);
  };
  for(const h of HOSTS){
    const pool=byFam[h.fam]; if(!pool)continue;
    const n=h.fam==='ws'?ri(1,11):h.fam==='net'?ri(0,5):ri(2,14);
    const used=new Set();
    for(let k=0;k<n;k++){
      const v=wpick(pool,pool.map(x=>x.weight*(h.lastScan<addDays(LATEST,-30)?.6:1)));
      if(used.has(v.idx))continue; used.add(v.idx);
      // steady-state program: findings arrive at a roughly even rate over the year, with a mild recency bump
      const age=wpick([ri(0,14),ri(15,45),ri(46,120),ri(121,240),ri(241,365)],[.05,.09,.23,.31,.32]);
      const firstSeen=addDays(LATEST,-age);
      const sla=SLA[v.severity];
      // closure likelihood rises with age relative to the SLA clock; a small tail stays open (the breaches the dashboard exists to surface)
      const closeP=Math.min(.99,(1-Math.exp(-(age/sla)*2.0))*(v.patch?1:.85)+(v.severity==='Critical'?.08:v.severity==='High'?.04:0));
      let closedDate=null,state=null,exception=null;
      if(age>2&&R()<closeP){
        // most closures land inside the SLA window; ~15% run late, up to ~2× the clock
        const d=Math.max(1,Math.round(Math.min(age,sla*(R()<.85?.08+R()*.9:1+R()*1.0))));
        closedDate=addDays(firstSeen,Math.min(d,age)); state='Closed';
      } else {
        if(age>45&&R()<(v.severity==='Low'?.05:v.severity==='Medium'?.03:.015)){
          state='Risk Accepted';
          const expiry=addDays(firstSeen,ri(60,240));
          exception={approver:pick(APPROVERS),justification:pick(JUSTIFICATIONS),expiry,requested:addDays(firstSeen,ri(3,20))};
        } else state=stateForOpen(age,v.severity);
      }
      const ticket=state==='New'?null:(state==='In Progress'&&R()<.4?`CHG${String(3000000+fid*7).slice(0,7)}`:`INC${String(4100000+fid*13).slice(0,7)}`);
      ALL.push({id:fid++,h,cve:v.cve,title:v.title,product:v.product,severity:v.severity,cvss:v.cvss,
        epss:Math.min(.99,Math.max(.001,v.epss*(0.75+R()*.5))),kev:v.kev,exploit:v.exploit,patch:v.patch,
        firstSeen,closedDate,state,exception,ticket,
        // host attributes flattened for filtering
        host:h.host,os:h.os,bu:h.bu,env:h.env,tag:h.tag,region:h.region,team:h.team,tier:h.tier,inet:h.inet,scanner:h.scanner});
    }
  }
}

/* Derived, snapshot-dependent annotations */
let SNAP=LATEST;
function annotate(snap){
  SNAP=snap;
  for(const r of ALL){
    r.asOf=r.firstSeen<=snap;
    r.open=r.asOf&&(!r.closedDate||r.closedDate>snap);
    r.age=r.asOf?dayDiff(snap,r.firstSeen):0;
    r.sla=SLA[r.severity]; r.due=addDays(r.firstSeen,r.sla);
    const remain=r.sla-r.age;
    r.daysOver=Math.max(0,r.age-r.sla);
    r.slaState=r.open?(remain<0?'Breached':remain<=7?'At risk':'Within SLA'):(r.closedDate&&r.closedDate<=r.due?'Closed on time':'Closed late');
    r.ageBand=r.age<15?AGE_BANDS[0]:r.age<=30?AGE_BANDS[1]:r.age<=60?AGE_BANDS[2]:r.age<=90?AGE_BANDS[3]:AGE_BANDS[4];
    r.overBand=!r.open?null:r.daysOver===0?'Within SLA':r.daysOver<=7?'1–7 d over':r.daysOver<=30?'8–30 d over':r.daysOver<=90?'31–90 d over':'90+ d over';
    // priority score (documented on the SOP page)
    let s=({Critical:50,High:35,Medium:15,Low:5})[r.severity]+r.epss*25+(r.kev?20:0)+({'Tier 0':15,'Tier 1':10,'Tier 2':5,'Tier 3':0})[r.tier]+(r.inet?10:0)+(r.exploit?5:0);
    r.score=Math.round(s);
    r.priority=s>=85?PRIORITIES[0]:s>=65?PRIORITIES[1]:s>=45?PRIORITIES[2]:PRIORITIES[3];
    if(r.exception){const d=dayDiff(r.exception.expiry,snap);r.excStatus=d<0?'Expired':d<=30?'Expiring ≤30 d':'Active'}
    // a finding closed after this snapshot was still in flight as of it
    r.stateNow=r.open?(r.state==='Closed'?(r.age<=3?'New':r.age<=10?'Triaged':'In Progress'):r.state):'Closed';
  }
}
annotate(LATEST);
/* ============================================================

const NS='http://www.w3.org/2000/svg';
function S(tag,attrs){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e}

function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function TOK(){return{surface:css('--surface'),ink:css('--ink'),ink2:css('--ink2'),muted:css('--muted'),grid:css('--grid'),axis:css('--axis'),accent:css('--accent'),deemph:css('--deemph'),
  sev:{Critical:css('--sev-crit'),High:css('--sev-high'),Medium:css('--sev-med'),Low:css('--sev-low')},
  s:[css('--s1'),css('--s2'),css('--s3'),css('--s4'),css('--s5'),css('--s6')],
  q:[css('--q100'),css('--q200'),css('--q300'),css('--q400'),css('--q500'),css('--q600'),css('--q700')],
  ord:[css('--q250'),css('--q350'),css('--q450'),css('--q550'),css('--q650')],
  good:css('--good'),warn:css('--warn'),serious:css('--serious'),crit:css('--crit')}}
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=10000?(n/1000).toFixed(1)+'K':n.toLocaleString('en-US');
const fmtP=n=>(Math.round(n*10)/10).toFixed(1)+'%';
function niceTicks(max,n){if(max<=0)return[0,1];const raw=max/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const c=raw/p;const step=(c<=1?1:c<=2?2:c<=2.5?2.5:c<=5?5:10)*p;const out=[];for(let v=0;v<=max+1e-9;v+=step)out.push(Math.round(v*1e6)/1e6);if(out[out.length-1]<max)out.push(out[out.length-1]+step);return out}
const luma=hex=>{const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(.2126*r+.7152*g+.0722*b)/255};
const textW=(s,fs)=>s.length*fs*.56;

/* tooltip */
const tt=document.getElementById('tt');
function showTip(e,title,rows){tt.replaceChildren();const t=H('div','t',title);tt.appendChild(t);
  for(const r of rows||[]){const d=H('div','r');const l=H('span');if(r.k){const k=H('i','k');k.style.background=r.k;l.appendChild(k)}l.appendChild(document.createTextNode(r.label));const b=H('b',null,r.value);d.append(l,b);tt.appendChild(d)}
  tt.style.display='block';moveTip(e)}
function moveTip(e){const w=tt.offsetWidth,h=tt.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tt.style.left=x+'px';tt.style.top=y+'px'}

/* rounded-top rect path (rounded data-end, square baseline) */
function topRect(x,y,w,h,r){if(h<=0)return'';r=Math.min(r,w/2,h);return`M${x},${y+h}V${y+r}a${r},${r} 0 0 1 ${r},-${r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${y+h}Z`}

/* Column chart: {cats, series:[{name,color,values}], stacked, width, height, onClick(i), target:{value,label}, fmt, labelCaps} */
function columnChart(o){
  const K=TOK(),fmt=o.fmt||fmtN,W=o.width,Hh=o.height||220,m={t:20,r:12,b:36,l:44};
  const iw=W-m.l-m.r,ih=Hh-m.t-m.b,n=o.cats.length;
  const tot=o.cats.map((c,i)=>o.stacked?o.series.reduce((s,se)=>s+(se.values[i]||0),0):Math.max(...o.series.map(se=>se.values[i]||0)));
  const ticks=niceTicks(Math.max(o.target?o.target.value:0,...tot,1),4),top=ticks[ticks.length-1];
  const y=v=>m.t+ih-(v/top)*ih;
  const svg=S('svg',{width:W,height:Hh,viewBox:`0 0 ${W} ${Hh}`,role:'img'});
  for(const tk of ticks){svg.appendChild(S('line',{x1:m.l,x2:W-m.r,y1:y(tk),y2:y(tk),stroke:tk===0?K.axis:K.grid,'stroke-width':1}));svg.appendChild(T(m.l-6,y(tk)+4,fmt(tk),{'text-anchor':'end','font-size':10.5,fill:K.muted}))}
  const band=iw/n,gcount=o.stacked?1:o.series.length,bw=Math.min(24,(band*.72)/gcount);
  const groupW=bw*gcount+(gcount-1)*2;
  const showEvery=band<44?Math.ceil(44/band):1;
  o.cats.forEach((c,i)=>{
    const cx=m.l+band*i+band/2;
    if(i%showEvery===0){let lab=String(c);const maxc=Math.floor((band*showEvery-6)/6);if(lab.length>maxc)lab=lab.slice(0,Math.max(3,maxc-1))+'…';svg.appendChild(T(cx,Hh-m.b+16,lab,{'text-anchor':'middle','font-size':10.5,fill:K.ink2}))}
    const g=S('g');let cum=0;
    o.series.forEach((se,si)=>{
      const v=se.values[i]||0;if(v<=0)return;
      if(o.stacked){const y1=y(cum+v),y0=y(cum);const isTop=cum+v>=tot[i]-1e-9;const hh=Math.max(0,y0-y1-(cum>0?2:0));
        const x=cx-bw/2;const yy=y1;const d=isTop?topRect(x,yy,bw,hh,4):`M${x},${yy}h${bw}v${hh}h-${bw}Z`;
        g.appendChild(S('path',{d,fill:se.color}));cum+=v}
      else{const x=cx-groupW/2+si*(bw+2);g.appendChild(S('path',{d:topRect(x,y(v),bw,y(0)-y(v),4),fill:se.color}))}
    });
    svg.appendChild(g);
    if(o.labelCaps!==false&&(n<=10||tot[i]===Math.max(...tot))&&tot[i]>0)svg.appendChild(T(cx,y(tot[i])-5,fmt(tot[i]),{'text-anchor':'middle','font-size':10.5,fill:K.ink2,'font-weight':600}));
    const hit=S('rect',{x:m.l+band*i,y:m.t,width:band,height:ih,class:'hit'});
    hover(hit,e=>{g.style.opacity=.75;showTip(e,String(c),o.series.map(se=>({k:se.color,label:se.name,value:fmt(se.values[i]||0)})).concat(o.series.length>1&&o.stacked?[{label:'Total',value:fmt(tot[i])}]:[]))});
    hit.addEventListener('pointerleave',()=>{g.style.opacity=1});
    if(o.onClick)hit.addEventListener('click',()=>o.onClick(i));
    svg.appendChild(hit);
  });
  if(o.target){const ty=y(o.target.value);svg.appendChild(S('line',{x1:m.l,x2:W-m.r,y1:ty,y2:ty,stroke:K.ink2,'stroke-width':1}));svg.appendChild(T(W-m.r,ty-4,o.target.label,{'text-anchor':'end','font-size':10,fill:K.ink2}))}
  return{node:svg,table:{cols:['Category',...o.series.map(s=>s.name)],rows:o.cats.map((c,i)=>[c,...o.series.map(s=>s.values[i]||0)])}};
}

/* Horizontal bars: {cats, series, stacked, width, rowH, onClick(i), colors (per-cat for single series), fmt, pct (100% mode)} */
function barChartH(o){
  const K=TOK(),fmt=o.fmt||fmtN,n=o.cats.length,rowH=o.rowH||26,W=o.width;
  const labW=Math.min(190,Math.max(...o.cats.map(c=>textW(String(c),11)))+10);

  const max=o.pct?1:Math.max(...tot,1);
  const svg=S('svg',{width:W,height:Hh,viewBox:`0 0 ${W} ${Hh}`,role:'img'});
  const bh=Math.min(16,rowH-8);
  o.cats.forEach((c,i)=>{
    const cy=m.t+rowH*i+rowH/2;
    let lab=String(c);const maxc=Math.floor(labW/6.2);if(lab.length>maxc)lab=lab.slice(0,maxc-1)+'…';

/* Line chart: {x:[labels], series:[{name,color,values}], area, width, height, fmt, onClick(i)} */

function hostMatches(h){
  for(const [k,set] of activeDims()){const d=DIM[k];if(!d.host)continue;const v=d.key==='host'?h.host:d.key==='scanAge'?scanBand(h):h[d.key];if(!set.has(v))return false}
  if(F.inet&&!h.inet)return false;
  if(F.search){const q=F.search.toLowerCase();if(!h.host.toLowerCase().includes(q))return false}
  return true}
let base=[],allF=[],openF=[],hostsF=[];
function compute(){base=ALL.filter(r=>r.asOf);allF=base.filter(r=>matches(r));openF=allF.filter(r=>r.open);hostsF=HOSTS.filter(hostMatches)}
const cnt=rows=>F.view==='instance'?rows.length:new Set(rows.map(r=>r.cve)).size;
function groupBy(rows,fn){const m=new Map();for(const r of rows){const k=fn(r);if(k==null)continue;let a=m.get(k);if(!a){a=[];m.set(k,a)}a.push(r)}return m}
function countsBy(rows,fn,keys){const m=groupBy(rows,fn);return keys.map(k=>cnt(m.get(k)||[]))}
function sevSeries(rows,fn,cats){const K=TOK();return SEVS.map(s=>({name:s,color:K.sev[s],values:countsBy(rows.filter(r=>r.severity===s),fn,cats)}))}
function sevLegend(){const K=TOK();return SEVS.map(s=>({name:s,color:K.sev[s]}))}
function toggleDim(key,value){const s=F.dims[key]||(F.dims[key]=new Set());if(s.has(value))s.delete(value);else s.add(value);render()}
function setDim(key,values){F.dims[key]=new Set(values);render()}
function isSel(key,value){const s=F.dims[key];return !!(s&&s.has(value))}
function clearAll(){F.dims={};F.kev=F.inet=F.exploit=false;F.search='';render()}
function preset(fn,page){F.dims={};F.kev=F.inet=F.exploit=false;F.search='';fn();if(page)F.page=page;render()}
function openAsOf(date){return ALL.filter(r=>r.firstSeen<=date&&(!r.closedDate||r.closedDate>date)&&matches(r,true))}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
/* last n complete calendar months on or before the snapshot (a partial month would read as a collapse) */
function months(n){const out=[];const lastFull=new Date(SNAP.getFullYear(),SNAP.getMonth(),0);for(let i=n-1;i>=0;i--){const d=new Date(lastFull.getFullYear(),lastFull.getMonth()-i,1);out.push({label:fmtMon(d),start:d,end:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59)})}return out}
function slaPool(){const cut=addDays(SNAP,-90);return allF.filter(r=>r.open||(r.closedDate&&r.closedDate>cut))}
function adherence(rows){const pool=rows.filter(r=>r.open||r.closedDate);if(!pool.length)return null;const ok=pool.filter(r=>r.slaState!=='Breached'&&r.slaState!=='Closed late').length;return ok/pool.length*100}
function mttr(rows){const cut=addDays(SNAP,-90);const c=rows.filter(r=>r.closedDate&&r.closedDate>cut);return c.length?mean(c.map(r=>dayDiff(r.closedDate,r.firstSeen))):null}
const dfmt=n=>n==null?'—':(Math.round(n*10)/10)+' d';
const pfmt=n=>n==null?'—':fmtP(n);

  'Past SLA':{what:'Open instances that have blown their remediation deadline.',how:'Age (days from first seen to the snapshot) is greater than the SLA days for the severity. '+SLA_TXT+' Sub-line = share of all open instances.'},
  'SLA adherence (90 d)':{what:'How well the program is keeping its remediation promises — the single number leadership asks for.',how:ADH_TXT+' Meter turns amber below 90% and red below 75%.'},
  'Mean time to remediate (90 d)':{what:'Average days it takes to close a finding, measured to scanner confirmation — not to “ticket closed”.',how:'Mean of (closure date − first seen) over findings closed in the 90 days before the snapshot. Sub-line repeats it for Critical and High only.'},
  'Scan coverage (30 d)':{what:'Share of in-scope assets the scanners have actually looked at recently — findings on unscanned assets are unknown, not zero.',how:'Assets with a successful scan in the 30 days before the snapshot ÷ all in-scope assets. Only asset-level filters apply (business unit, environment, OS, team, tier, region, scanner, tag).'},
  'Affected assets':{what:'How many hosts carry at least one open finding.',how:'Distinct host names among open instances. Sub-line: distinct CVEs and raw instance count for the same set.'},
  /* ---- Overview cards ---- */
  'Open by severity & SLA state':{what:'For each severity, how much of the open work is comfortably inside SLA, about to breach, or already breached.',how:'Within SLA = due date more than 7 days away. At risk = due within 7 days. Breached = past due. Segments are open instances; labels are the row total. '+SLA_TXT},
  'Remediation trend — opened vs. fixed':{what:'Inflow vs. outflow. When Opened sits above Fixed the backlog grows.',how:'Per complete calendar month: Opened = instances first seen in that month; Fixed = instances whose scanner-confirmed closure falls in that month. The partial current month is excluded so it never reads as a collapse.'},
  'Open backlog':{what:'The size of the open queue at the end of each of the last 12 months.',how:'For each month end: instances first seen on or before that date and not closed by it. Same rule as the headline count, replayed historically.'},
  'Open by business unit':{what:'Which parts of the business carry the risk, and of what severity.',how:'Open instances grouped by the CMDB business unit of the host, stacked by severity, sorted by total.'},
  'Age of open findings':{what:'How stale the queue is. A heavy 91+ bar means old debt, not new inflow.',how:'Days from first seen to the snapshot, bucketed < 15 · 15–30 · 31–60 · 61–90 · 91+.'},
  'Action queue':{what:'The seven things a VM lead should look at today, each already filtered for you.',how:'KEV past SLA = KEV flag and breached. P1 = priority score ≥ 85. Critical on internet-facing = severity Critical and externally reachable. Due within 7 days = at-risk SLA state. Pending verification = ServiceNow state. Exceptions expiring = risk acceptances with ≤ 30 days to expiry. Not scanned = assets with no successful scan in 30 days.'},
  'Top vulnerabilities':{what:'The CVEs that generate the most work — one fix here closes many rows.',how:'One row per CVE/plugin among open findings. Inst. = host × CVE pairs; Hosts = distinct hosts; EPSS = mean across those instances; Past SLA = breached instances; Oldest = the oldest instance’s age.'},
  'Top hosts':{what:'The assets carrying the most open findings.',how:'One row per host. Max score = the highest priority score among its open findings (see Risk Prioritization → Priority tiers).'},
  /* ---- Prioritize ---- */
  'P1 · Fix now':{what:'Findings that should be in today’s stand-up.',how:'Priority score ≥ 85. Score = severity (Crit 50 / High 35 / Med 15 / Low 5) + EPSS × 25 + KEV 20 + asset tier (T0 15 / T1 10 / T2 5) + internet-facing 10 + public exploit 5.'},
  'KEV open':{what:'Open instances on the CISA Known Exploited Vulnerabilities list.',how:'Open instances with the KEV flag. Same as the Overview tile; repeated here because it drives the priority score.'},
  'EPSS ≥ 0.70':{what:'Findings with a high probability of being exploited soon, regardless of CVSS.',how:'EPSS (FIRST’s Exploit Prediction Scoring System) ≥ 0.70 = at least a 70% chance of exploitation activity in the next 30 days. Refreshed daily in production; synthetic here.'},
  'Tier 0 exposed':{what:'Critical/High findings on crown-jewel assets.',how:'Open instances where severity is Critical or High and the host’s CMDB criticality is Tier 0 (payment rails, core banking, identity).'},
  'Internet-facing Crit/High':{what:'Serious findings an attacker can reach without being inside the network.',how:'Open Critical/High instances on hosts flagged internet-facing in the CMDB / external attack-surface inventory.'},
  'Public exploit available':{what:'Findings with working exploit code in the open — Metasploit modules, public PoCs.',how:'Open instances whose scanner plugin metadata reports a public exploit. Sub-line = those with no vendor patch yet (mitigation, not patching, is the only option).'},
  'Priority tiers':{what:'The whole open queue sorted into four buckets so the team argues about the rule, not each ticket.',how:'Score = severity (Crit 50 / High 35 / Med 15 / Low 5) + EPSS × 25 + KEV 20 + tier (T0 15 / T1 10 / T2 5 / T3 0) + internet-facing 10 + public exploit 5. P1 ≥ 85 · P2 ≥ 65 · P3 ≥ 45 · P4 < 45.'},
  'Exploitability vs. impact':{what:'Why CVSS alone is a bad queue: the dots that matter are top-right, and KEV dots matter wherever they sit.',how:'One dot per open CVE. x = CVSS base score, y = mean EPSS across its instances. Blue = on the CISA KEV list. Quadrant lines at CVSS 7.0 and EPSS 0.50. Hover any dot; click to filter.'},
  'Severity × asset criticality':{what:'Where severity meets business impact — the darkest cells are the real risk.',how:'Count of open instances by severity (rows) and CMDB asset tier (columns). Colour is a single-hue scale of the count; click a cell to filter both dimensions.'},
  'Exploit, patch & KEV status':{what:'How much of the queue is actively dangerous, and how much of it can simply be patched.',how:'Share of open instances with a public exploit; with a vendor patch available; on the CISA KEV list. Each bar is 100% of open instances.'},
  'Priority by owner team':{what:'Who is holding the urgent work.',how:'Open instances by the host’s owner team, stacked by priority tier (see Priority tiers for the score).'},
  'Prioritized remediation queue':{what:'The work list, in the order it should be done.',how:'Top 400 open instances by priority score. Due = first seen + SLA days. SLA pill: green within, amber due ≤ 7 d, red past due. Sort any column; click a row to filter by CVE.'},
  /* ---- Remediation & SLA ---- */
  'Breached':{what:'Open instances past their due date.',how:'Age > SLA days for the severity. Sub-line = breached by more than 30 days. '+SLA_TXT},
  'Due within 7 days':{what:'Open instances that will breach within a week unless fixed — the cheapest breaches to prevent.',how:'SLA days − age is between 0 and 7. Click to filter.'},
  'MTTR · Critical':{what:'Average days to close a Critical.',how:'Mean of (closure − first seen) over Critical findings closed in the last 90 days. SLA is 7 days.'},
  'MTTR · High':{what:'Average days to close a High.',how:'Mean of (closure − first seen) over High findings closed in the last 90 days. SLA is 30 days.'},
  'Fixed last 30 days':{what:'Throughput — how many findings the org actually closed recently.',how:'Instances with a scanner-confirmed closure in the 30 days before the snapshot. Sub-line = share of those closed on or before their due date.'},
  'SLA adherence by severity':{what:'Whether the program keeps its promises on the findings that matter most — Critical adherence is the number regulators ask about.',how:ADH_TXT+' Computed per severity; the line is the 90% target.'},
  'Mean time to remediate by severity':{what:'How long each severity really takes to fix, against its SLA.',how:'Mean of (closure − first seen) per severity over findings closed in the last 90 days. Compare with SLA 7 / 30 / 60 / 120 days.'},
  'SLA breach aging':{what:'Not just whether findings are late, but how late.',how:'Open instances per severity, split by days past due: within SLA · 1–7 · 8–30 · 31–90 · 90+ days over.'},
  'Opened vs. fixed — monthly':{what:'Monthly inflow and outflow side by side.',how:'Per complete calendar month: Opened = first seen in the month; Fixed = closure date in the month. Net = fixed − opened.'},
  'Backlog composition over time':{what:'Whether the backlog is growing, and whether it is growing in the severities that matter.',how:'Instances open at each month end (first seen ≤ month end, not closed by it), stacked by severity.'},
  'Due in the next 7 days':{what:'The list to work this week to avoid new breaches.',how:'Open instances with 0–7 days left on their SLA, sorted by days left (= SLA days − age).'},
  'Remediation velocity by team':{what:'Who is shipping fixes, and whether they ship them on time.',how:'Instances closed in the last 30 days by owner team. On time = closed on or before the due date; Late = after.'},
  /* ---- Ownership ---- */
  'Open by owner team':{what:'The open queue by who has to fix it.',how:'Open instances grouped by the host’s CMDB owner team, stacked by severity.'},
  'SLA adherence by team':{what:'Accountability in one number per team.',how:ADH_TXT+' Computed per owner team; the line is the 90% target.'},
  'Team × age of open findings':{what:'Which teams are sitting on old work.',how:'Open instances by owner team (rows) and age band (columns). Single-hue scale of the count; click a cell to filter both.'},
  'Workflow pipeline':{what:'Where open findings sit in the ServiceNow process. A fat “Pending Verification” means the scanner, not the team, is the bottleneck.',how:'Open instances by workflow state: New → Triaged → Assigned → In Progress → Pending Verification, plus Risk Accepted. Bar = share of the largest stage. Click a stage to filter every page.'},
  'Accountability leaderboard':{what:'One row per team: volume, urgency, lateness, speed.',how:'Open / Critical / KEV / Breached = open instance counts. % breached = breached ÷ open. Oldest = max age. SLA adherence and MTTR use the same 90-day definitions as the KPI tiles. Pending verify = instances awaiting re-scan.'},
  /* ---- Coverage & Exceptions ---- */
  'Not scanned in 30 days':{what:'Assets the program is blind to right now.',how:'In-scope assets with no successful scan in the 30 days before the snapshot. Sub-line = how many of them are Tier 0/1.'},
  'Credentialed scans':{what:'Share of assets scanned with credentials — the only way to see missing patches, not just open ports.',how:'Assets whose most recent scan was authenticated ÷ in-scope assets.'},
  'Agent coverage':{what:'Share of assets reporting through a scanner agent, which keeps roaming and off-VPN devices visible.',how:'Agent-eligible assets (everything except network devices) with an agent ÷ agent-eligible assets. Sub-line = eligible assets without one.'},
  'End-of-life platforms':{what:'Assets on an OS or firmware the vendor no longer patches — every new CVE there is permanent.',how:'In-scope assets flagged end-of-life in the CMDB / scanner OS fingerprint.'},
  'Active exceptions (POA&M)':{what:'Findings the business has formally accepted for now.',how:'Open findings in Risk Accepted state whose exception expiry is more than 30 days away. Sub-line = all risk acceptances regardless of expiry.'},
  'Expiring ≤ 30 days':{what:'Exceptions that need a re-review decision this month.',how:'Risk-accepted findings whose expiry is within 30 days of the snapshot.'},
  'Expired, still open':{what:'Exceptions that lapsed while the finding stayed open — these are back on the SLA clock and usually already breached.',how:'Risk-accepted findings whose expiry is before the snapshot date.'},
  'Coverage by OS':{what:'Where scanning is thin — network devices are usually the weak spot.',how:'Per OS, share of assets: credentialed scan in last 30 d · unauthenticated scan in last 30 d · no scan in 30 d. Each bar is 100% of that OS.'},
  'Last successful scan':{what:'Freshness of the data every other page is built on.',how:'In-scope assets bucketed by days since their last successful scan: 0–7 · 8–30 · 31–90 · 91+.'},
  'Exceptions by justification':{what:'Why risk is being accepted. “Vendor patch not yet available” is legitimate; “Legacy — decommission scheduled” needs a date.',how:'Open risk-accepted findings grouped by the justification recorded on the exception.'},
  'Exceptions expiring — next 6 months':{what:'The re-review workload ahead, so nobody discovers 40 expiries in one week.',how:'Open risk-accepted findings counted by the calendar month of their expiry date, for the six months starting with the snapshot month.'},
  'Hygiene gaps by OS':{what:'Structural problems that make remediation impossible or invisible.',how:'Per OS: assets flagged end-of-life, and agent-eligible assets without a scanner agent.'},
  'Risk exceptions & acceptances (POA&M)':{what:'The exception register — what is accepted, why, by whom, until when.',how:'Every open finding in Risk Accepted state. Days to expiry = expiry − snapshot (negative = expired). Status: Active > 30 d · Expiring ≤ 30 d · Expired < 0.'},
  /* ---- SOP ---- */
  'Live workflow pipeline':{what:'The same ServiceNow pipeline as the Ownership page, placed next to the process it implements.',how:'Open instances by workflow state under the current filters. Click a stage to filter every page.'},
  'SLA policy':{what:'The remediation clocks the whole dashboard enforces.',how:'Reference table. Every “Past SLA”, “At risk”, adherence and MTTR figure on the other pages uses these days. Overrides tighten a clock; they never loosen one.'},
  'Escalation matrix':{what:'Who hears about a late finding, and when.',how:'Reference table driven by the ServiceNow SLA timers; the Breached and At-risk states on the dashboard are the same timers surfaced visually.'},
  'Standard operating procedure — remediation runbook':{what:'The eight steps a finding goes through, with an owner and an exit criterion each.',how:'Reference content. Step 3 contains the priority-score formula used by the Risk Prioritization page.'},
  'Weekly cadence':{what:'The meetings and jobs that keep the queue moving.',how:'Reference content. Friday’s metrics freeze produces the weekly snapshot selectable in the filter bar.'},
  'Metric definitions':{what:'Every number on this dashboard, defined once.',how:'Reference content. The ⓘ button on each card repeats the relevant definition in place.'},
  'RACI':{what:'Who is responsible, accountable, consulted and informed for each activity.',how:'Reference content.'},
  'Glossary':{what:'Terms used across the pages.',how:'Reference content.'},
};
/* ============================================================
   5. UI wiring — tabs, slicers, chips, export, theme, render loop
   ============================================================ */
const tabsEl=document.getElementById('tabs'),filtersEl=document.getElementById('filters'),chipsEl=document.getElementById('chips');
for(const [id,label] of PAGES){const b=H('button','tab',label);b.setAttribute('role','tab');b.dataset.page=id;b.addEventListener('click',()=>{F.page=id;render()});tabsEl.appendChild(b)}

/* snapshot + saved views + multi-selects + toggles + search */
function buildFilters(){
  filtersEl.replaceChildren();
  const snapLbl=H('span','lbl','Snapshot');const snap=H('select','sel');SNAPSHOTS.forEach(d=>{const o=H('option',null,fmtDate(d)+(d===LATEST?' · latest':''));o.value=d.getTime();if(d.getTime()===SNAP.getTime())o.selected=true;snap.appendChild(o)});
  snap.addEventListener('change',()=>{annotate(new Date(+snap.value));render()});
  filtersEl.append(snapLbl,snap);
  const viewsLbl=H('span','lbl','Saved view');const views=H('select','sel');
  const VIEWS=[['— choose —',null],
    ['Board pack · Production Crit/High',()=>preset(()=>{F.dims.env=new Set(['Production']);F.dims.severity=new Set(['Critical','High'])},'overview')],
    ['Fix-now queue (P1)',()=>preset(()=>{F.dims.priority=new Set([PRIORITIES[0]])},'prioritize')],
    ['KEV sweep',()=>preset(()=>{F.kev=true},'prioritize')],
    ['Crown jewels (Tier 0)',()=>preset(()=>{F.dims.tier=new Set(['Tier 0'])},'overview')],
    ['Audit prep · breached + exceptions',()=>preset(()=>{F.dims.slaState=new Set(['Breached']);F.dims.env=new Set(['Production'])},'coverage')],
    ['Internet-facing exposure',()=>preset(()=>{F.inet=true},'prioritize')],
    ['Endpoint fleet (workstations + macOS)',()=>preset(()=>{F.dims.os=new Set(['Windows Workstation','macOS'])},'ownership')],
  ];
  VIEWS.forEach(([l,fn],i)=>{const o=H('option',null,l);o.value=i;views.appendChild(o)});
  views.addEventListener('change',()=>{const v=VIEWS[+views.value];if(v[1])v[1]();views.value=0});
  filtersEl.append(viewsLbl,views);
  for(const d of DIMS){if(d.hidden)continue;filtersEl.appendChild(multiSelect(d))}
  const tg=(label,key)=>{const b=H('button','tg');b.setAttribute('aria-pressed',F[key]);b.append(H('i'),document.createTextNode(label));b.addEventListener('click',()=>{F[key]=!F[key];render()});return b};
  filtersEl.append(tg('KEV only','kev'),tg('Internet-facing','inet'),tg('Public exploit','exploit'));
  const s=H('input','search');s.type='search';s.placeholder='Search host, CVE, title…';s.value=F.search;let t;s.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{F.search=s.value.trim();render(true)},250)});
  filtersEl.appendChild(s);
}
function multiSelect(d){
  const wrap=H('div','ms');const btn=H('button');const sel=F.dims[d.key]||new Set();
  const b=H('b',null,d.label);const n=H('span','n',sel.size?`· ${sel.size===1?[...sel][0]:sel.size+' selected'}`:'· All');btn.append(b,n,document.createTextNode(' ▾'));if(sel.size)btn.classList.add('on');
  const pop=H('div','pop');const acts=H('div','acts');const all=H('button',null,'All');const none=H('button',null,'None');
  all.addEventListener('click',()=>{F.dims[d.key]=new Set();render()});none.addEventListener('click',()=>{F.dims[d.key]=new Set(d.values);render()});acts.append(all,none);pop.appendChild(acts);
  const counts=groupBy(base.filter(r=>r.open&&matches(r)),d.get);
  for(const v of d.values){const l=H('label');const c=H('input');c.type='checkbox';c.checked=sel.has(v);c.addEventListener('change',()=>{const s=F.dims[d.key]||(F.dims[d.key]=new Set());if(c.checked)s.add(v);else s.delete(v);render()});l.append(c,document.createTextNode(v),H('span','c',fmtN(cnt(counts.get(v)||[]))));pop.appendChild(l)}
  btn.addEventListener('click',e=>{e.stopPropagation();const open=pop.classList.contains('open');document.querySelectorAll('.ms .pop.open').forEach(p=>p.classList.remove('open'));if(!open)pop.classList.add('open')});
  pop.addEventListener('click',e=>e.stopPropagation());
  wrap.append(btn,pop);return wrap;
}
document.addEventListener('click',()=>document.querySelectorAll('.ms .pop.open').forEach(p=>p.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.ms .pop.open').forEach(p=>p.classList.remove('open'));document.getElementById('modal').classList.remove('open')}});

function buildChips(){
  chipsEl.replaceChildren();
  const items=[];
  for(const [k,set] of activeDims()){const d=DIM[k];for(const v of set)items.push([d.label,v,()=>{set.delete(v);render()}])}
  if(F.kev)items.push(['KEV','only',()=>{F.kev=false;render()}]);if(F.inet)items.push(['Exposure','internet-facing',()=>{F.inet=false;render()}]);if(F.exploit)items.push(['Exploit','public',()=>{F.exploit=false;render()}]);
  if(F.search)items.push(['Search',F.search,()=>{F.search='';render()}]);
  if(!items.length){chipsEl.appendChild(H('span',null,'No filters — click any bar, cell, row or KPI to cross-filter every page. Snapshot: '+fmtDate(SNAP)+' · '+fmtN(openF.length)+' open instances · '+fmtN(hostsF.length)+' assets in scope.'));return}
  chipsEl.appendChild(H('span',null,'Filters:'));
  for(const [l,v,fn] of items){const c=H('button','chip');c.append(document.createTextNode(l+' '),H('b',null,v),H('span','x','✕'));c.addEventListener('click',fn);chipsEl.appendChild(c)}
  const s=H('span',null,`→ ${fmtN(openF.length)} open instances · ${fmtN(new Set(openF.map(r=>r.cve)).size)} CVEs · ${fmtN(new Set(openF.map(r=>r.host)).size)} hosts`);s.style.marginLeft='6px';chipsEl.appendChild(s);
}

/* export */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function csvOf(rows){const cols=['host','ip','os','bu','env','tag','region','team','tier','inet','scanner','cve','title','product','severity','cvss','epss','kev','exploit','patch','first_seen','due','age_days','sla_state','state','priority','score','ticket','exception_status','exception_expiry'];
  const esc=v=>{const s=v==null?'':String(v);return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[cols.join(',')];for(const r of rows)lines.push([r.host,r.h.ip,r.os,r.bu,r.env,r.tag,r.region,r.team,r.tier,r.inet?'Y':'N',r.scanner,r.cve,r.title,r.product,r.severity,r.cvss,r.epss.toFixed(3),r.kev?'Y':'N',r.exploit?'Y':'N',r.patch?'Y':'N',fmtDate(r.firstSeen),fmtDate(r.due),r.age,r.slaState,r.stateNow,r.priority,r.score,r.ticket||'',r.excStatus||'',r.exception?fmtDate(r.exception.expiry):''].map(esc).join(','));return lines.join('\n')}
document.getElementById('exportBtn').addEventListener('click',async()=>{const csv=csvOf(openF);try{await navigator.clipboard.writeText(csv);toast(`Copied ${fmtN(openF.length)} filtered rows as CSV`)}catch(e){}
  const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=`Export — ${fmtN(openF.length)} open findings (CSV)`;document.getElementById('modalText').value=csv;m.classList.add('open')});
document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modal').classList.remove('open'));
document.getElementById('modalCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.getElementById('modalText').value);toast('Copied to clipboard')}catch(e){document.getElementById('modalText').select()}});
document.getElementById('clearBtn').addEventListener('click',clearAll);
document.getElementById('themeBtn').addEventListener('click',()=>{const root=document.documentElement;const cur=root.getAttribute('data-theme');const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;const dark=cur?cur==='dark':sysDark;root.setAttribute('data-theme',dark?'light':'dark');render()});
document.getElementById('viewSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;F.view=b.dataset.v;render()});

/* render loop */
let renderTimer=null;
function render(keepFocus){
  compute();
  for(const b of tabsEl.children)b.setAttribute('aria-selected',b.dataset.page===F.page);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===F.view));
  const active=document.activeElement;const wasSearch=keepFocus&&active&&active.classList.contains('search');const selPos=wasSearch?active.selectionStart:0;
  buildFilters();buildChips();
  if(wasSearch){const s=filtersEl.querySelector('.search');s.focus();s.setSelectionRange(selPos,selPos)}
  main.replaceChildren();
  const fn={overview:pageOverview,prioritize:pagePrioritize,remediation:pageRemediation,ownership:pageOwnership,coverage:pageCoverage,sop:pageSop}[F.page];
  for(const n of fn())main.appendChild(n);
  hideTip();
}
addEventListener('resize',()=>{clearTimeout(renderTimer);renderTimer=setTimeout(()=>render(),160)});
render();
</script>
</body></html>
